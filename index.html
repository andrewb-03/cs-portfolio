<!DOCTYPE html>
<html lang="en" class="page-home">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andrew Brockenborough - Portfolio</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="page-home">
    <header class="site-header">
        <a href="index.html" class="site-logo">Andrew Brockenborough</a>
    </header>
    <!-- Hero Section (AI chat only on homepage) -->
    <section id="home" class="hero">
        <div class="hero-container">
            <div class="hero-content">
                <div class="chat-panel terminal-window-style">
                    <div class="chat-header">
                        <div class="terminal-window-controls">
                            <span class="terminal-btn terminal-btn-close"></span>
                            <span class="terminal-btn terminal-btn-minimize"></span>
                            <span class="terminal-btn terminal-btn-maximize"></span>
                        </div>
                        <span class="chat-header-label">andrew@portfolio — ask</span>
                    </div>
                    <div class="chat-body">
                        <div class="chat-messages" id="chat-messages">
                            <div class="terminal-line chat-welcome">
                                <span class="prompt">$</span>
                                <span class="command">ask andrew</span>
                            </div>
                            <div class="terminal-output chat-output">
                                Ask me anything about Andrew — background, skills, projects, education, or contact info.
                            </div>
                            <div class="suggested-questions">
                                <span class="suggestion-label">Try:</span>
                                <button type="button" class="suggestion-btn" data-question="Where did Andrew go to school?">education</button>
                                <button type="button" class="suggestion-btn" data-question="Tell me about Andrew's projects">projects</button>
                                <button type="button" class="suggestion-btn" data-question="What are Andrew's skills?">skills</button>
                                <button type="button" class="suggestion-btn" data-question="How can I contact Andrew?">contact</button>
                            </div>
                        </div>
                        <div class="chat-input-wrap">
                            <div class="terminal-line chat-input-line">
                                <span class="prompt">$</span>
                                <input type="text" id="chat-input" class="chat-input" placeholder="Ask a question..." autocomplete="off" spellcheck="false">
                                <span class="cursor chat-cursor" id="chat-cursor">_</span>
                            </div>
                            <div class="chat-error" id="chat-error"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="js/content-routes.js"></script>
    <script src="script.js"></script>
</body>
</html>
